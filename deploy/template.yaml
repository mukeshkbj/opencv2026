AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Twice, OpenCV 5 move-in/move-out change engine on Lambda (Graviton) with S3, KMS and Bedrock.

Parameters:
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region used for Claude on Amazon Bedrock. The model must be enabled in this region.
  BedrockModelId:
    Type: String
    Default: anthropic.claude-opus-5-5
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Origin allowed by the Function URL CORS rule.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional address that receives the Lambda error alarm.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  BucketKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts Twice evidence objects in S3.
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  SigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Signs Twice evidence manifests (ECDSA P-256).
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 1
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt BucketKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-30-days
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 2
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: remove-orphan-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub ${EvidenceBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlarmEmail
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 25, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlarmEmail}]

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  TwiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [arm64]
      MemorySize: 3008
      Timeout: 60
      ReservedConcurrentExecutions: 10
      EphemeralStorage:
        Size: 1024
      LoggingConfig:
        LogGroup: !Ref FunctionLogs
      Environment:
        Variables:
          TWICE_BUCKET: !Ref EvidenceBucket
          TWICE_KMS_KEY_ID: !GetAtt SigningKey.Arn
          TWICE_BEDROCK_REGION: !Ref BedrockRegion
          TWICE_BEDROCK_MODEL: !Ref BedrockModelId
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref AllowedOrigin]
          AllowMethods: ["*"]
          AllowHeaders: ["*"]
          MaxAge: 600
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadWriteEvidence
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub ${EvidenceBucket.Arn}/*
            - Sid: ListForNotFound
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt EvidenceBucket.Arn
            - Sid: EncryptEvidence
              Effect: Allow
              Action: [kms:GenerateDataKey, kms:Decrypt]
              Resource: !GetAtt BucketKey.Arn
            - Sid: SignManifests
              Effect: Allow
              Action: [kms:Sign, kms:GetPublicKey]
              Resource: !GetAtt SigningKey.Arn
            - Sid: InvokeClaude
              Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: !Sub arn:${AWS::Partition}:bedrock:${BedrockRegion}::foundation-model/${BedrockModelId}
            - Sid: InvokeClaudeMessagesApi
              Effect: Allow
              Action: [bedrock-mantle:CreateInference, bedrock-mantle:GetProject]
              Resource: !Sub arn:${AWS::Partition}:bedrock-mantle:${BedrockRegion}:${AWS::AccountId}:project/*
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ..
      DockerTag: latest

  FunctionUrlInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TwiceFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Twice Lambda returned an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TwiceFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

Outputs:
  FunctionUrl:
    Value: !GetAtt TwiceFunctionUrl.FunctionUrl
  BucketName:
    Value: !Ref EvidenceBucket
  SigningKeyId:
    Value: !Ref SigningKey

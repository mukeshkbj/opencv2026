    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

      --color-muted:  #6b675c;
      --color-accent: #e2401a;   /* signal vermilion */

    html { background: var(--color-paper); }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      padding: 40px;
    }
    .frame { max-width: 1280px; width: 100%; margin: 0 auto; }
    header { height: 88px; }
    /* min-width equals the viewBox width, so the type ramp is never scaled down;

    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      height: 24px;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 40px;
      color: var(--color-ink);
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
